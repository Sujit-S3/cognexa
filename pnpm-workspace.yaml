packages:
  - web
  - Server
  - packages/*

injectWorkspacePackages: true

overrides:
  brace-expansion: 5.0.8

allowBuilds:
  esbuild: true
  # OpenTelemetry uses the runtime JS implementation; its optional generator hook is not needed.
  protobufjs: false
  sharp: true

catalog:
  typescript: ^5.9.3
